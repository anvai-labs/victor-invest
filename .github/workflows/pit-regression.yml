name: PIT Regression Guard

on:
  push:
    branches: ["main", "master"]
  pull_request:

env:
  # Install victor-ai from source (develop branch) until framework.extensions
  # is available in a released PyPI version.
  VICTOR_AI_SOURCE: 'git+https://github.com/vjsingh1984/victor.git@develop'
  VICTOR_SDK_SOURCE: 'git+https://github.com/vjsingh1984/victor.git@develop#subdirectory=victor-sdk'

jobs:
  pit-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "${{ env.VICTOR_SDK_SOURCE }}"
          pip install "${{ env.VICTOR_AI_SOURCE }}"
          pip install -e ".[dev]"

      - name: Run PIT regression suite
        env:
          TESTING: true
        run: pytest -v tests/unit/
