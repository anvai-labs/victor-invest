application:
  name: InvestiGator
  version: 0.1.0
  environment: development
  debug: false
database:
  host: ${DB_HOST:-dataserver1.singh.local}
  port: 5432
  database: ${DB_DATABASE:-sec_database}
  username: ${DB_USERNAME}
  password: ${DB_PASSWORD}
  pool_size: 10
  max_overflow: 20
sec:
  user_agent: InvestiGator/1.0 (research@example.com)
  base_url: https://data.sec.gov/
  rate_limit: 10
  cache_dir: data/sec_cache
  ticker_cache_file: data/ticker_cik_map.txt
  max_retries: 3
  timeout: 30
  max_periods_to_analyze: 8
  require_submissions: false
  include_amended_filings: true
ollama:
  base_url: http://192.168.1.20:11434
  keep_alive: -1
  timeout: 1800
  max_retries: 3
  min_context_size: 4096
  num_llm_threads: 1
  pool_strategy: prefer_remote
  servers:
  - url: http://192.168.1.20:11434
    total_ram_gb: 84
    usable_ram_gb: 20
    metal: false
    max_concurrent: 3
    priority: 100
    description: Windows RTX 4000 Ada - gpt-oss:20b, qwen3:30b, deepseek-r1:70b, llama3.1:70b,
      llama3.3:70b
  - url: http://localhost:11434
    total_ram_gb: 64
    usable_ram_gb: 48
    metal: true
    max_concurrent: 1
    priority: 0
  models:
    fundamental_analysis: gpt-oss:20b
    quarterly_analysis: gpt-oss:20b
    technical_analysis: gpt-oss:20b
    market_context: gpt-oss:20b
    summary: gpt-oss:20b
    comparison: gpt-oss:20b
    decision: gpt-oss:20b
    comprehensive_analysis: gpt-oss:20b
    synthesis: gpt-oss:20b
    risk_assessment: gpt-oss:20b
    quick_analysis: gpt-oss:20b
  model_specs:
    gpt-oss:20b:
      context_window: 131072
      parameters: 20.9B
      memory_gb: 13.0
      reasoning_score: 0.92
      thinking_capability: true
      default_num_predict: 4096
      max_num_predict: 16384
      architecture: gptoss
      weights_vram_gb: 13.0
      kv_cache_mb_per_1k_tokens: 192
      kv_cache_overhead_pct: 0.15
    deepseek-r1:32b:
      context_window: 32768
      parameters: 32.8B
      memory_gb: 19.0
      reasoning_score: 0.98
      thinking_capability: true
      default_num_predict: 6144
      max_num_predict: 16384
      architecture: qwen2
      weights_vram_gb: 19.0
      kv_cache_mb_per_1k_tokens: 384
      kv_cache_overhead_pct: 0.15
    qwen3:30b:
      context_window: 262144
      parameters: 30.5B
      memory_gb: 16.2
      reasoning_score: 0.97
      thinking_capability: true
      default_num_predict: 4096
      max_num_predict: 16384
      architecture: qwen3moe
      weights_vram_gb: 16.2
      kv_cache_mb_per_1k_tokens: 256
      kv_cache_overhead_pct: 0.15
    qwen3:32b:
      context_window: 40960
      parameters: 32.8B
      memory_gb: 18
      reasoning_score: 0.96
      thinking_capability: true
      default_num_predict: 4096
      max_num_predict: 8192
      architecture: qwen3
      weights_vram_gb: 18
      kv_cache_mb_per_1k_tokens: 256
      kv_cache_overhead_pct: 0.15
    llama3.3:70b:
      context_window: 131072
      parameters: 70.6B
      memory_gb: 37.8
      reasoning_score: 0.99
      thinking_capability: true
      default_num_predict: 4096
      max_num_predict: 16384
      architecture: llama
      weights_vram_gb: 37.8
      kv_cache_mb_per_1k_tokens: 256
      kv_cache_overhead_pct: 0.15
    llama3.1:8b:
      context_window: 131072
      parameters: 8.0B
      memory_gb: 4.5
      reasoning_score: 0.92
      thinking_capability: false
      default_num_predict: 2048
      max_num_predict: 8192
      architecture: llama
      weights_vram_gb: 4.5
      kv_cache_mb_per_1k_tokens: 256
      kv_cache_overhead_pct: 0.15
  num_predict:
    fundamental_analysis: 4096
    quarterly_analysis: 4096
    technical_analysis: 6144
    market_context: 4096
    summary: 2048
    comparison: 4096
    decision: 6144
    comprehensive_analysis: 4096
    synthesis: 8192
    risk_assessment: 4096
    quick_analysis: 2048
  use_toon_format: false
  toon_agents:
    technical_analysis: true
    fundamental_analysis: true
    synthesis: true
    market_context: false
    valuation: false
victor_llm:
  provider: ollama
  model: gpt-oss:20b
  anthropic:
    model: claude-sonnet-4-20250514
    api_key_env: ANTHROPIC_AUTH_TOKEN
    base_url_env: ANTHROPIC_BASE_URL
    max_tokens: 8192
    temperature: 0.3
  openai:
    model: gpt-4o
    api_key_env: OPENAI_API_KEY
    base_url: https://api.openai.com/v1
    max_tokens: 4096
    temperature: 0.3
  ollama:
    model: gpt-oss:20b
    base_url: http://192.168.1.20:11434
    timeout: 1800
    max_tokens: 4096
    temperature: 0.3
cache_control:
  read_from_cache: true
  write_to_cache: true
  force_refresh: false
  force_refresh_symbols: null
  storage:
  - disk
  - rdbms
  types:
  - sec_response
  - llm_response
  - technical_data
  - submission_data
  - company_facts
  - quarterly_metrics
  - market_context
  disk_structure:
    use_symbol_directories: true
    compression:
      enabled: true
      algorithm: gzip
      level: 9
      apply_to_all: true
      file_extensions:
      - .json
      - .txt
      - .parquet
      - .csv
      - .log
    base_paths:
      sec_cache: data/sec_cache
      llm_cache: data/llm_cache
      technical_cache: data/technical_cache
      market_context_cache: data/market_context_cache
    directory_structure:
      sec_cache: '{base_path}/{cache_type}/{symbol}/'
      llm_cache: '{base_path}/{symbol}/'
      technical_cache: '{base_path}/{symbol}/'
      market_context_cache: '{base_path}/'
  industry_metrics:
    storage_backend: parquet
    parquet_path: data/industry_metrics_cache
    compression: gzip
    ttl_days: 7
analysis:
  fundamental_weight: 0.6
  technical_weight: 0.4
  min_score_for_buy: 7.0
  max_score_for_sell: 4.0
  lookback_days: 365
  min_volume: 1000000
  max_prompt_tokens: 32768
orchestrator:
