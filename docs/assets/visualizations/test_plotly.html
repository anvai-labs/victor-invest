<!DOCTYPE html>
<html>
<head>
    <title>Test Plotly</title>
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
</head>
<body>
    <h1>Test Plotly Chart</h1>
    <div id="test-chart" style="width:100%;height:400px;"></div>

    <script>
        console.log("Script loaded");
        console.log("Plotly available:", typeof Plotly !== 'undefined');

        const trace1 = {
            x: [1, 2, 3, 4],
            y: [10, 15, 13, 17],
            type: 'scatter',
            mode: 'lines+markers',
            name: 'Test Data'
        };

        const layout = {
            title: 'Test Chart',
            xaxis: { title: 'X' },
            yaxis: { title: 'Y' }
        };

        console.log("Creating plot...");
        Plotly.newPlot('test-chart', [trace1], layout);
        console.log("Plot created!");
    </script>
</body>
</html>
