[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "victor-invest"
version = "0.7.0"
description = "AI-powered investment analysis platform combining SEC fundamentals, technical indicators, and multi-model valuation synthesis"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [
    {name = "Vijaykumar Singh", email = "singhvjd@gmail.com"}
]
maintainers = [
    {name = "Vijaykumar Singh", email = "singhvjd@gmail.com"}
]
keywords = [
    "investment",
    "research",
    "sec",
    "financial-analysis",
    "llm",
    "valuation",
    "fundamental-analysis",
    "technical-analysis",
    "ai",
    "machine-learning"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # Victor SDK definition contract
    "victor-contracts>=0.7.0,<1.0",

    # Core dependencies
    "requests>=2.32.0,<2.34",
    "pandas>=2.0.0",
    "numpy>=1.24.0,<2.3",
    "scipy>=1.11.0",
    "networkx>=3.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "aiohttp>=3.9.0",

    # API Framework
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.4.0",
    "python-multipart>=0.0.6",

    # Yahoo Finance API
    "yfinance>=0.2.0",

    # XML parsing
    "lxml>=4.9.0",

    # JSON handling
    "ujson>=5.8.0",
    "orjson>=3.9.0",

    # Data processing
    "pyarrow>=13.0.0",

    # PDF generation
    "reportlab>=4.0.0",
    "markdown>=3.5.0",

    # Email functionality
    "secure-smtplib>=0.1.1",
    "aiosmtplib>=3.0.0",

    # Progress bars and CLI
    "tqdm>=4.66.0",
    "click>=8.1.0",
    "rich>=13.6.0",

    # Date/time handling
    "python-dateutil>=2.8.0",
    "pendulum>=2.1.0",

    # Caching
    "diskcache>=5.6.0",
    "redis[hiredis]>=5.0.0",
    "aiocache>=0.12.0",

    # Configuration
    "pyyaml>=6.0.0",
    "python-dotenv>=1.0.0",

    # Database
    "alembic>=1.12.0",
    "asyncpg>=0.29.0",

    # Message Queue
    "celery>=5.3.0",
    "kombu>=5.3.0",

    # Monitoring
    "prometheus-client>=0.18.0",
    "opentelemetry-api>=1.39.1,<1.42",
    "opentelemetry-sdk>=1.39.1,<1.42",
    "opentelemetry-instrumentation-fastapi>=0.60b1,<0.63b0",
    "psutil>=5.9.0",

    # Vector Database
    "qdrant-client>=1.6.0",

    # WebSocket
    "websockets>=12.0.0",
    "python-socketio>=5.10.0",

    # Security
    "cryptography>=41.0.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",

    # Data Validation
    "marshmallow>=3.20.0",
    "cerberus>=1.3.0",

    # Logging
    "structlog>=23.2.0",
    "loguru>=0.7.0",
]

[project.optional-dependencies]
runtime = [
    "victor-ai>=0.7.0,<1.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "coverage>=7.3.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.5.0",
    "flake8>=6.1.0",
    "ruff>=0.4.0",
]
viz = [
    "matplotlib>=3.7.0",
    "plotly>=5.15.0",
]
jupyter = [
    "jupyter>=1.0.0",
    "ipykernel>=6.25.0",
]

[project.scripts]
# Main CLI entry point - pip installable, cross-platform
investigator = "investigator.cli:main"
# Alias for backwards compatibility
inv = "investigator.cli:main"
# Victor-powered CLI
victor-invest = "victor_invest.cli:main"
# Legacy CLI (deprecated - use 'investigator' instead)
investigator-legacy = "cli_orchestrator:cli"

# Plugin entry point (consolidated, SDK >= 0.7.0).
# All registration (tools, vertical, dependencies, safety) is handled inside
# InvestmentPlugin.register(context) so only this one entry point is needed.
[project.entry-points."victor.plugins"]
investment = "victor_invest.vertical:plugin"

# Sidecar entry points kept for backward compatibility with SDK < 0.7.0 hosts
# that scan these groups directly instead of calling plugin.register(context).
[project.entry-points."victor.tool_dependencies"]
invest = "victor_invest.tool_dependencies:get_provider"

[project.entry-points."victor.safety_rules"]
invest = "victor_invest.safety_enhanced:create_investment_safety_rules"

[project.entry-points."victor.prompt_contributors"]
invest = "victor_invest.prompts.contributor:InvestmentPromptContributor"

[project.entry-points."victor.workflow_providers"]
invest = "victor_invest.workflows:InvestmentWorkflowProvider"

[project.urls]
Homepage = "https://github.com/vjsingh1984/victor-invest"
Documentation = "https://github.com/vjsingh1984/victor-invest#readme"
Repository = "https://github.com/vjsingh1984/victor-invest"
Issues = "https://github.com/vjsingh1984/victor-invest/issues"
Changelog = "https://github.com/vjsingh1984/victor-invest/releases"

[tool.setuptools]
package-dir = {"" = "src", "victor_invest" = "victor_invest"}

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["investigator*", "victor_invest*"]
exclude = ["tests*", "docs*"]

[tool.victor.contract_audit]
source_roots = ["victor_invest"]
exclude = [
    "victor_invest/api/**",
    "victor_invest/cli.py",
    "victor_invest/framework_bootstrap.py",
]

[tool.black]
line-length = 120
target-version = ['py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | data
  | artifacts
)/
'''

[tool.isort]
profile = "black"
line_length = 120
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip_gitignore = true
skip = [".venv", "build", "dist", "data", "artifacts"]

[tool.ruff]
# Same line length as Black
line-length = 120

# Target Python versions
target-version = "py311"

# Exclude directories matching Black's extend-exclude
extend-exclude = [
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".tox",
    ".venv",
    "build",
    "dist",
    "data",
    "artifacts",
]

[tool.ruff.format]
# Use double quotes (Black default)
quote-style = "double"

# Use spaces for indentation (Black default)
indent-style = "space"

# Preserve magic trailing commas (Black style)
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "yfinance.*",
    "qdrant_client.*",
    "diskcache.*",
    "plotly.*",
]
ignore_missing_imports = true

[tool.flake8]
max-line-length = 120
extend-ignore = ["E203", "W503", "E501"]
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    ".mypy_cache",
    ".venv",
    "data",
    "artifacts"
]

[tool.pylint."MESSAGES CONTROL"]
disable = [
    "C0114", # Missing module docstring
    "C0115", # Missing class docstring
    "C0116", # Missing function or method docstring
    "R0903", # Too few public methods (often applies to simple data classes or agents)
    "R0913", # Too many arguments
    "W0613", # Unused argument
    "W1203", # Use % formatting in logging functions and pass data as arguments
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --cov=investigator --cov=victor_invest --cov-report=term-missing"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "llm: marks tests that require LLM access",
    "db: marks tests that require database access",
]

[tool.coverage.run]
source = ["src/investigator", "victor_invest"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
